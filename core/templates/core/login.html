{% extends "core/base.html" %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-slate-100">

    <div class="w-full max-w-md bg-white shadow-xl rounded-xl p-8">

        <!-- Header -->
         
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-slate-800">Ops System</h1>
            <p class="text-slate-500 mt-2">
                Sign in to continue
            </p>
        </div>

        <!-- Error -->
        {% if error %}
        <div class="mb-4 p-3 bg-red-100 text-red-700 rounded">
            {{ error }}
        </div>
        {% endif %}

        <!-- Login Form -->
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Username
                </label>
                <input
                    id="id_username"
                    type="text"
                    name="username"
                    required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Enter your username"
                >
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">
                    Password
                </label>
                <input
                    id="id_password"
                    type="password"
                    name="password"
                    required
                    class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    placeholder="Enter your password"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">
                Sign In
            </button>
        </form>


        <!-- Demo Purpose Credentials -->
        <br>
        <br>
        <button onclick="fillStaff()" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">
            Fill Staff Credentials (DEMO)
        </button>

        <br>
        <br>
        <button onclick="fillAdmin()" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700 transition">
            Fill Admin Credentials (DEMO)
        </button>

        <script>
        function fillAdmin() {
            document.getElementById("id_username").value = "Michael";
            document.getElementById("id_password").value = "Demo@123";
        }
        </script>
        
        <script>
        function fillStaff() {
            document.getElementById("id_username").value = "Dwight";
            document.getElementById("id_password").value = "Demo@456";
        }
        </script>
        
        <!-- Divider -->
        <div class="my-6 border-t"></div>

        <!-- Home / Landing Link -->
        <div class="text-center">
            <a href="/"
               class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 font-medium">
                ← Back to Home
            </a>
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-6 text-sm text-slate-500">
            Internal system • Authorized users only
        </div>

    </div>
</div>

{% endblock %}
